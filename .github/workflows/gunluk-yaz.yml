# Simumav - gunluk dosyasindan suzulmus satirlari dogrudan is ciktisina yazar (yalniz okur; artefakt kullanmaz - depolama kotasindan bagimsiz)
name: gunluk-yaz

on:
  workflow_dispatch:
    inputs:
      klasor:
        description: "Gunluk klasoru"
        type: string
        default: "D:\\Simumav\\Simumav-dev\\Simumav\\Saved\\Logs"
      desen:
        description: "Suzgec (regex)"
        type: string
        default: "Error|Warning"
      dosya:
        description: "Dosya adi deseni"
        type: string
        default: "Simumav*.log"
      derin:
        description: "Alt klasorlerde de ara (derinlik; 0 = yalniz klasor)"
        type: string
        default: "0"
      azami:
        description: "En cok satir"
        type: string
        default: "1500"

jobs:
  yaz:
    if: github.repository_owner == 'goktalay'
    runs-on: [self-hosted, windows, "${{ vars.RUNNER_LABEL || 'unreal' }}"]
    timeout-minutes: 15
    defaults:
      run:
        shell: powershell
    steps:
      - name: Satirlar
        env:
          KLASOR: ${{ inputs.klasor }}
          DESEN: ${{ inputs.desen }}
          AZAMI: ${{ inputs.azami }}
          DOSYA: ${{ inputs.dosya }}
          DERIN: ${{ inputs.derin }}
        run: |
          $ErrorActionPreference = 'Continue'
          $d = [int]$env:DERIN
          $hep = if ($d -gt 0) { Get-ChildItem -Path $env:KLASOR -Filter $env:DOSYA -File -Recurse -Depth $d -Force -ErrorAction SilentlyContinue } else { Get-ChildItem -LiteralPath $env:KLASOR -Filter $env:DOSYA -File -ErrorAction SilentlyContinue }
          $hep | Sort-Object LastWriteTime -Descending | Select-Object -First 15 | ForEach-Object { Write-Host ("BULUNAN " + $_.FullName + "  " + $_.Length + "  " + $_.LastWriteTime) }
          $f = $hep | Sort-Object LastWriteTime -Descending | Select-Object -First 1
          Get-ChildItem -LiteralPath $env:KLASOR -Filter '*.log' -File -ErrorAction SilentlyContinue | ForEach-Object { Write-Host ("  " + $_.Name + "  " + $_.Length + "  " + $_.LastWriteTime) }
          if (-not $f) { Write-Host "Gunluk yok: $env:KLASOR"; exit 0 }
          Write-Host ("Dosya: " + $f.FullName + "  " + $f.Length + " bayt  " + $f.LastWriteTime)
          Select-String -LiteralPath $f.FullName -Pattern $env:DESEN -Encoding UTF8 | Select-Object -First ([int]$env:AZAMI) | ForEach-Object { Write-Host $_.Line }
