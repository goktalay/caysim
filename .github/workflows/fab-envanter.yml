# Simumav - Fab / Epic icerik envanteri (sirket bilgisayari). Yalniz okur: hicbir dosyayi degistirmez, kopyalamaz.
# Satin alinan Fab iceriklerinin (asset paketleri, motor eklentileri) nerede durdugunu listeler; sonuc fab-envanter.txt artefakti.
name: fab-envanter

on:
  workflow_dispatch:
    inputs:
      runner:
        description: "Runner etiketi (bos = vars.RUNNER_LABEL ya da unreal; yeni bilgisayar: unreal5080)"
        type: string
        default: ""
      ekstra:
        description: "Ek taranacak klasorler (; ile ayrilmis)"
        type: string
        default: ""

jobs:
  envanter:
    if: github.repository_owner == 'goktalay'
    runs-on: [self-hosted, windows, "${{ inputs.runner || vars.RUNNER_LABEL || 'unreal' }}"]
    timeout-minutes: 30
    defaults:
      run:
        shell: powershell
    steps:
      - name: Envanter
        env:
          UE_ROOT: ${{ vars.UE_ROOT }}
          EKSTRA: ${{ inputs.ekstra }}
        run: |
          $ErrorActionPreference = 'Continue'
          $out = Join-Path $env:RUNNER_TEMP 'fab-envanter.txt'
          function W($s) { Add-Content -Path $out -Value $s -Encoding UTF8; Write-Host $s }
          function Size($p) { try { $b = (Get-ChildItem -LiteralPath $p -Recurse -File -Force -ErrorAction SilentlyContinue | Measure-Object Length -Sum).Sum; '{0:N1} MB' -f ($b / 1MB) } catch { '?' } }
          W ("whoami: " + (whoami))
          W ("UE_ROOT: " + $env:UE_ROOT)
          $ue = if ($env:UE_ROOT) { $env:UE_ROOT } else { 'D:\Epic Games\UE_5.8' }
          W "=== Motor eklentileri (Marketplace / Fab) ==="
          foreach ($d in @("$ue\Engine\Plugins\Marketplace", "$ue\Engine\Plugins\Fab")) {
            if (Test-Path $d) { Get-ChildItem $d -Directory | ForEach-Object { W ("  " + $_.FullName + "  [" + (Size $_.FullName) + "]") } } else { W ("  (yok) " + $d) }
          }
          W "=== Launcher ayarlari (VaultCache yeri) ==="
          $ini = Get-ChildItem -Path "C:\Users\*\AppData\Local\EpicGamesLauncher\Saved\Config\Windows*\GameUserSettings.ini" -ErrorAction SilentlyContinue
          foreach ($f in $ini) { W ("  " + $f.FullName); Select-String -Path $f.FullName -Pattern 'Vault|Cache|Install' | ForEach-Object { W ("    " + $_.Line) } }
          W "=== Aday klasorler ==="
          $cands = @('C:\ProgramData\Epic\EpicGamesLauncher\VaultCache', 'D:\VaultCache', 'D:\Epic Games\VaultCache', 'D:\Epic Games', 'C:\Program Files\Epic Games', 'D:\Fab', 'D:\FabLibrary')
          $cands += Get-ChildItem -Path "C:\Users\*\AppData\Local\Fab*", "C:\Users\*\Documents\Unreal Projects", "D:\Unreal Projects", "C:\Users\*\AppData\Local\UnrealEngine\Common\Fab*" -Directory -ErrorAction SilentlyContinue | ForEach-Object { $_.FullName }
          if ($env:EKSTRA) { $cands += $env:EKSTRA.Split(';') | Where-Object { $_ } }
          foreach ($d in $cands) {
            if (-not (Test-Path $d)) { W ("  (yok) " + $d); continue }
            W ("  " + $d)
            Get-ChildItem $d -Directory -ErrorAction SilentlyContinue | ForEach-Object { W ("    " + $_.Name + "  [" + (Size $_.FullName) + "]") }
          }
          W "=== Diskte .uproject dosyalari (D:, derinlik 4) ==="
          Get-ChildItem -Path D:\ -Filter *.uproject -Recurse -Depth 4 -ErrorAction SilentlyContinue | ForEach-Object { W ("  " + $_.FullName) }
          W "=== Diskte Content klasoru olan paketler (VaultCache benzeri: */data/Content) ==="
          foreach ($root in @('C:\ProgramData\Epic', 'D:\')) {
            Get-ChildItem -Path $root -Directory -Recurse -Depth 4 -Filter Content -ErrorAction SilentlyContinue | Where-Object { $_.Parent.Name -eq 'data' } | ForEach-Object { W ("  " + $_.FullName + "  [" + (Size $_.FullName) + "]") }
          }
          W "=== Ust duzey .uasset iceren Content alt klasorleri (D: projeleri) ==="
          Get-ChildItem -Path D:\ -Filter *.uproject -Recurse -Depth 4 -ErrorAction SilentlyContinue | ForEach-Object {
            $c = Join-Path $_.DirectoryName 'Content'
            if (Test-Path $c) { Get-ChildItem $c -Directory -ErrorAction SilentlyContinue | ForEach-Object { W ("  " + $_.FullName + "  [" + (Size $_.FullName) + "]") } }
          }
          W "=== VaultCache ayrinti (FabLibrary dosyalari + paketlerin ilk 3 duzeyi) ==="
          $vc = 'C:\ProgramData\Epic\EpicGamesLauncher\VaultCache'
          if (Test-Path "$vc\FabLibrary") { Get-ChildItem "$vc\FabLibrary" -Recurse -File -ErrorAction SilentlyContinue | ForEach-Object { W ("  " + $_.FullName + "  " + $_.Length) } }
          Get-ChildItem $vc -Directory -ErrorAction SilentlyContinue | Where-Object { $_.Name -ne 'FabLibrary' } | ForEach-Object {
            Get-ChildItem $_.FullName -Directory -Recurse -Depth 3 -ErrorAction SilentlyContinue | ForEach-Object { W ("  " + $_.FullName) }
            Get-ChildItem $_.FullName -File -Recurse -Depth 1 -ErrorAction SilentlyContinue | ForEach-Object { W ("  F " + $_.FullName + "  " + $_.Length) }
          }
          W "=== FabLibrary icindeki metin/json dosyalari (ilk 4000 karakter) ==="
          if (Test-Path "$vc\FabLibrary") { Get-ChildItem "$vc\FabLibrary" -Recurse -File -Include *.json,*.txt,*.ini -ErrorAction SilentlyContinue | Select-Object -First 5 | ForEach-Object { W ("--- " + $_.FullName); $t = Get-Content -LiteralPath $_.FullName -Raw -ErrorAction SilentlyContinue; if ($t) { W ($t.Substring(0, [Math]::Min(4000, $t.Length))) } } }
          W "=== Fab hazirlama projesi (D:\SimumavFab; docs/fab-icerik.md) ==="
          $fp = 'D:\SimumavFab'
          if (Test-Path $fp) {
            Get-ChildItem $fp -Filter *.uproject -File -ErrorAction SilentlyContinue | ForEach-Object { W ("  proje: " + $_.FullName) }
            if (Test-Path "$fp\Content") {
              Get-ChildItem "$fp\Content" -Directory -ErrorAction SilentlyContinue | ForEach-Object {
                $n = @(Get-ChildItem $_.FullName -Recurse -File -Filter *.umap -ErrorAction SilentlyContinue).Count
                W ("  " + $_.Name + "  [" + (Size $_.FullName) + "]  harita: " + $n)
              }
            } else { W "  (Content yok)" }
            try { $acl = (Get-Acl $fp).Access | Where-Object { $_.IdentityReference -match 'NETWORK SERVICE|Users|Everyone|Authenticated' } | ForEach-Object { $_.IdentityReference.ToString() + ':' + $_.FileSystemRights } ; W ("  izinler: " + ($acl -join '; ')) } catch { W "  izinler okunamadi" }
          } else { W ("  (yok) " + $fp) }
          W "=== Alt projeler (hazirlama projesi altindaki *.uproject) ==="
          if (Test-Path $fp) {
            Get-ChildItem $fp -Directory -ErrorAction SilentlyContinue | ForEach-Object {
              $u = Get-ChildItem $_.FullName -Filter *.uproject -File -ErrorAction SilentlyContinue | Select-Object -First 1
              if ($u) {
                $flags = @('Content', 'Config', 'Plugins', 'Source') | ForEach-Object { $_ + '=' + (Test-Path (Join-Path $u.DirectoryName $_)) }
                W ("  " + $u.FullName + "  [" + (Size $u.DirectoryName) + "]  " + ($flags -join ' '))
                Get-ChildItem (Join-Path $u.DirectoryName 'Content') -Directory -ErrorAction SilentlyContinue | ForEach-Object { W ("    Content\" + $_.Name + "  [" + (Size $_.FullName) + "]") }
                try { $pj = Get-Content $u.FullName -Raw | ConvertFrom-Json; W ("    eklentiler: " + ((@($pj.Plugins) | Where-Object { $_.Enabled } | ForEach-Object { $_.Name }) -join ', ')) } catch { W "    uproject okunamadi" }
              }
            }
          }
          W "=== Haritalar (.umap; hazirlama projesi + VaultCache data\Content) ==="
          $hk = @("$fp\Content") + @(Get-ChildItem $vc -Directory -ErrorAction SilentlyContinue | Where-Object { $_.Name -ne 'FabLibrary' } | ForEach-Object { Join-Path $_.FullName 'data\Content' })
          foreach ($k in $hk) {
            if (-not (Test-Path $k)) { continue }
            Get-ChildItem $k -Recurse -File -Filter *.umap -ErrorAction SilentlyContinue | ForEach-Object { W ("  " + $_.FullName.Substring($k.Length) + "  " + [math]::Round($_.Length / 1KB) + " KB  <" + $k + ">") }
          }
          W "=== Paket klasor agaci (ilk 2 duzey, hazirlama projesi) ==="
          if (Test-Path "$fp\Content") {
            Get-ChildItem "$fp\Content" -Directory -ErrorAction SilentlyContinue | ForEach-Object {
              W ("  " + $_.Name)
              Get-ChildItem $_.FullName -Directory -ErrorAction SilentlyContinue | ForEach-Object {
                $n = @(Get-ChildItem $_.FullName -Recurse -File -Filter *.uasset -ErrorAction SilentlyContinue).Count
                W ("    " + $_.Name + "  (" + $n + " uasset)")
                Get-ChildItem $_.FullName -Directory -ErrorAction SilentlyContinue | Select-Object -First 25 | ForEach-Object { W ("      " + $_.Name) }
              }
            }
          }
          W "=== Ses varliklari (adinda Sound/Audio/SFX gecen paketler; ilk 120 dosya) ==="
          if (Test-Path "$fp\Content") {
            Get-ChildItem "$fp\Content" -Directory -ErrorAction SilentlyContinue | Where-Object { $_.Name -match '(?i)sound|audio|sfx' } | ForEach-Object {
              $r = $_.FullName
              Get-ChildItem $r -Recurse -File -Filter *.uasset -ErrorAction SilentlyContinue | Select-Object -First 120 | ForEach-Object { W ("  " + $_.FullName.Substring($r.Length) + "  " + [math]::Round($_.Length / 1KB) + " KB") }
            }
          }
          W "=== Ultra Dynamic Sky ust duzey varliklar ==="
          if (Test-Path "$fp\Content\UltraDynamicSky") { Get-ChildItem "$fp\Content\UltraDynamicSky" -Recurse -File -Filter *.uasset -Depth 1 -ErrorAction SilentlyContinue | ForEach-Object { W ("  " + $_.FullName.Substring($fp.Length)) } }
          W "=== VaultCache UE paketleri: indirme durumu ==="
          Get-ChildItem $vc -Directory -ErrorAction SilentlyContinue | Where-Object { $_.Name -ne 'FabLibrary' } | ForEach-Object {
            $dc = Join-Path $_.FullName 'data\Content'
            $st = Join-Path $_.FullName 'stage'
            $d = if (Test-Path $dc) { 'data\Content VAR [' + (Size $dc) + ']' } else { 'data\Content YOK' }
            $s2 = if (Test-Path $st) { 'stage [' + (Size $st) + ']' } else { 'stage yok' }
            W ("  " + $_.Name + ": " + $d + ", " + $s2)
          }
          W "=== DDC / Zen (BaseEngine.ini bolumleri, zenserver surecleri) ==="
          $bi = "$ue\Engine\Config\BaseEngine.ini"
          if (Test-Path $bi) {
            $sec = ''
            foreach ($ln in (Get-Content $bi)) {
              if ($ln -match '^\[(.+)\]') { $sec = $Matches[1]; if ($sec -match 'DerivedData|Zen|DDC|Fallback|Cache') { W ("  [" + $sec + "]") }; continue }
              if ($sec -match '^Zen' -and $ln -match '^\s*[^;].*=') { W ("    " + $ln) }
            }
          }
          Get-CimInstance Win32_Process -Filter "Name='zenserver.exe'" -ErrorAction SilentlyContinue | ForEach-Object { $o = try { (Invoke-CimMethod -InputObject $_ -MethodName GetOwner).User } catch { '?' }; W ("  zenserver pid " + $_.ProcessId + " sahip " + $o + " : " + $_.CommandLine) }
          Get-CimInstance Win32_Process -Filter "Name='UnrealEditor.exe'" -ErrorAction SilentlyContinue | ForEach-Object { W ("  UnrealEditor pid " + $_.ProcessId) }
          W "=== Motor eklentisi ayrinti (.uplugin + klasor agaci) ==="
          foreach ($d in (Get-ChildItem "$ue\Engine\Plugins\Marketplace" -Directory -ErrorAction SilentlyContinue | Where-Object { $_.Name -match '(?i)overcrow' })) {
            Get-ChildItem $d.FullName -Filter *.uplugin -File -Recurse -Depth 1 -ErrorAction SilentlyContinue | ForEach-Object { W ("--- " + $_.FullName); $t = Get-Content -LiteralPath $_.FullName -Raw; W $t.Substring(0, [Math]::Min(3000, $t.Length)) }
            Get-ChildItem $d.FullName -Directory -Recurse -Depth 3 -ErrorAction SilentlyContinue | ForEach-Object { $n = @(Get-ChildItem $_.FullName -File -ErrorAction SilentlyContinue).Count; W ("  " + $_.FullName.Substring($d.FullName.Length) + "  (" + $n + " dosya)") }
            Get-ChildItem (Join-Path $d.FullName 'Content') -Recurse -File -Filter *.uasset -ErrorAction SilentlyContinue | Select-Object -First 400 | ForEach-Object { W ("  A " + $_.FullName.Substring($d.FullName.Length) + "  " + [math]::Round($_.Length / 1KB) + " KB") }
            Get-ChildItem (Join-Path $d.FullName 'Content') -Recurse -File -Filter *.umap -ErrorAction SilentlyContinue | ForEach-Object { W ("  M " + $_.FullName.Substring($d.FullName.Length)) }
            Get-ChildItem (Join-Path $d.FullName 'Binaries') -Recurse -File -ErrorAction SilentlyContinue | Select-Object -First 20 | ForEach-Object { W ("  B " + $_.FullName.Substring($d.FullName.Length) + "  " + $_.Length) }
            W "--- OverCrowd API (Public basliklari: UCLASS / USTRUCT / UFUNCTION imzalari)"
            Get-ChildItem (Join-Path $d.FullName 'Source') -Recurse -File -Filter *.h -ErrorAction SilentlyContinue | Where-Object { $_.FullName -match '\\Public\\' } | ForEach-Object {
              $f = $_
              W ("  H " + $f.FullName.Substring($d.FullName.Length))
              $ln = @(Get-Content -LiteralPath $f.FullName -ErrorAction SilentlyContinue)
              for ($i = 0; $i -lt $ln.Count; $i++) {
                if ($ln[$i] -match 'UCLASS|USTRUCT|UFUNCTION|UENUM') {
                  $nx = if ($i + 1 -lt $ln.Count) { $ln[$i + 1].Trim() } else { '' }
                  $nx2 = if ($i + 2 -lt $ln.Count) { $ln[$i + 2].Trim() } else { '' }
                  W ("    " + $ln[$i].Trim() + " || " + $nx + " " + $(if ($nx -notmatch '[;{]$') { $nx2 } else { '' }))
                }
              }
            }
          }
          W "=== Yeni paketlerin varlik dosyalari (adlar) ==="
          $ayr = @("$fp\Content\City_Traffic_Pro\Cars", "$fp\Content\City_Traffic_Pro\Meshes", "$fp\Content\City_Traffic_Pro\Additional_Blueprints", "$fp\Content\BendylabStudios", "$fp\Content\DJI AGRAS T50.blend", "$fp\DroneMegaPackandControlle\Content\DroneMegaPack", "$fp\FPVDrone\Content\AT_Drone", "$vc\Intercepead5933957bbV1\data\Content\BendylabStudios")
          foreach ($k in $ayr) {
            if (-not (Test-Path -LiteralPath $k)) { W ("  (yok) " + $k); continue }
            W ("--- " + $k)
            Get-ChildItem -LiteralPath $k -Recurse -File -ErrorAction SilentlyContinue | Where-Object { $_.Name -notmatch '^(T_|TX_)' } | Select-Object -First 300 | ForEach-Object { W ("  " + $_.FullName.Substring($k.Length) + "  " + [math]::Round($_.Length / 1KB) + " KB") }
          }
          W "=== Blender ==="
          $bl = @(Get-ChildItem 'C:\Program Files\Blender Foundation' -Recurse -Filter blender.exe -File -Depth 2 -ErrorAction SilentlyContinue | ForEach-Object { $_.FullName })
          $bl += @(Get-Command blender -ErrorAction SilentlyContinue | ForEach-Object { $_.Source })
          if ($bl.Count) { $bl | ForEach-Object { W ("  " + $_) } } else { W "  blender yok" }
          W "=== Disk bos alan ==="
          Get-PSDrive -PSProvider FileSystem | ForEach-Object { W ("  " + $_.Name + ": bos " + ('{0:N0} GB' -f ($_.Free / 1GB))) }
      - name: Artefakt
        uses: actions/upload-artifact@v4
        with:
          name: fab-envanter
          path: ${{ runner.temp }}/fab-envanter.txt
