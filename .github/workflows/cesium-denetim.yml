# Simumav - Cesium ion erisim denetimi (yalniz okur). secrets.CESIUM_ION_TOKEN ile verilen varlik kimliklerinin uc noktasini sorar;
# yalniz HTTP durumu, varlik turu ve dis tur/host yazilir (belirtec ve varlik erisim anahtari YAZDIRILMAZ).
name: cesium-denetim

on:
  workflow_dispatch:
    inputs:
      runner:
        description: "Runner etiketi (bos = vars.RUNNER_LABEL ya da unreal)"
        type: string
        default: ""
      varliklar:
        description: "ion varlik kimlikleri (virgulle)"
        type: string
        default: "1,2,3954,2275207,96188,3,4"

jobs:
  denetim:
    if: github.repository_owner == 'goktalay'
    runs-on: [self-hosted, windows, "${{ inputs.runner || vars.RUNNER_LABEL || 'unreal' }}"]
    timeout-minutes: 10
    defaults:
      run:
        shell: powershell
    steps:
      - name: ion
        env:
          CESIUM_ION_TOKEN: ${{ secrets.CESIUM_ION_TOKEN }}
          VARLIK: ${{ inputs.varliklar }}
        run: |
          $ErrorActionPreference = 'Continue'
          [Net.ServicePointManager]::SecurityProtocol = [Net.SecurityProtocolType]::Tls12
          Add-Type -AssemblyName System.Web
          if (-not $env:CESIUM_ION_TOKEN) { Write-Host "CESIUM_ION_TOKEN yok"; exit 0 }
          Write-Host ("Belirtec uzunlugu: " + $env:CESIUM_ION_TOKEN.Length)
          foreach ($id in ($env:VARLIK.Split(',') | Where-Object { $_ })) {
            $u = "https://api.cesium.com/v1/assets/" + $id.Trim() + "/endpoint?access_token=" + $env:CESIUM_ION_TOKEN
            try {
              $r = Invoke-WebRequest -Uri $u -UseBasicParsing -TimeoutSec 30
              $j = $r.Content | ConvertFrom-Json
              $h = ''
              if ($j.url) { $h = ([Uri]$j.url).Host }
              if ($j.options -and $j.options.url) { $h = ([Uri]$j.options.url).Host }
              $att = 0
              if ($j.attributions) { $att = @($j.attributions).Count }
              Write-Host ("varlik " + $id + ": HTTP " + [int]$r.StatusCode + " tur=" + $j.type + " dis=" + $j.externalType + " host=" + $h + " atif=" + $att)
            } catch {
              $code = ''
              if ($_.Exception.Response) { $code = [int]$_.Exception.Response.StatusCode }
              $msg = $_.ErrorDetails.Message
              if ($msg) { $msg = $msg.Replace($env:CESIUM_ION_TOKEN, '***') }
              Write-Host ("varlik " + $id + ": HATA " + $code + " " + $msg)
            }
          }
          # Google 3B: ion uc noktasindan kok tileset + ilk icerik karolari (yalniz durum / sure / boyut)
          try {
            $e = Invoke-WebRequest -Uri ("https://api.cesium.com/v1/assets/2275207/endpoint?access_token=" + $env:CESIUM_ION_TOKEN) -UseBasicParsing -TimeoutSec 30
            $ej = $e.Content | ConvertFrom-Json
            $root = $ej.options.url
            if (-not $root) { $root = $ej.url }
            $sw = [Diagnostics.Stopwatch]::StartNew()
            $r = Invoke-WebRequest -Uri $root -UseBasicParsing -TimeoutSec 60
            Write-Host ("google kok: HTTP " + [int]$r.StatusCode + " " + $r.Content.Length + " B " + $sw.ElapsedMilliseconds + " ms")
            $u = [Uri]$root
            $key = [System.Web.HttpUtility]::ParseQueryString($u.Query)['key']
            $j = $r.Content | ConvertFrom-Json
            $queue = New-Object System.Collections.Queue
            foreach ($c in $j.root.children) { $queue.Enqueue($c) }
            $n = 0; $session = ''
            while ($queue.Count -gt 0 -and $n -lt 12) {
              $c = $queue.Dequeue()
              if (-not $c.content) { foreach ($cc in $c.children) { $queue.Enqueue($cc) }; continue }
              $cu = $c.content.uri
              $full = [Uri]::new($u, $cu).AbsoluteUri
              if ($full -notmatch 'key=') { if ($full -match '\?') { $full += '&key=' + $key } else { $full += '?key=' + $key } }
              if ($session -and $full -notmatch 'session=') { $full += '&session=' + $session }
              $sw = [Diagnostics.Stopwatch]::StartNew()
              try {
                $cr = Invoke-WebRequest -Uri $full -UseBasicParsing -TimeoutSec 60
                $ct = $cr.Headers['Content-Type']
                Write-Host ("google karo " + $n + ": HTTP " + [int]$cr.StatusCode + " " + $ct + " " + $cr.RawContentLength + " B " + $sw.ElapsedMilliseconds + " ms  " + ($cu -replace '\?.*',''))
                if ($ct -match 'json') {
                  $sub = $cr.Content | ConvertFrom-Json
                  if ($cu -match 'session=([^&]+)') { $session = $Matches[1] }
                  foreach ($cc in $sub.root.children) { $queue.Enqueue($cc) }
                  if ($sub.root.content) { $queue.Enqueue($sub.root) }
                }
              } catch { Write-Host ("google karo " + $n + ": HATA " + $_.Exception.Message + " " + $sw.ElapsedMilliseconds + " ms") }
              $n++
            }
          } catch { Write-Host ("google testi HATA: " + $_.Exception.Message) }
          try {
            $r = Invoke-WebRequest -Uri ("https://api.cesium.com/v1/assets?access_token=" + $env:CESIUM_ION_TOKEN) -UseBasicParsing -TimeoutSec 30
            $j = $r.Content | ConvertFrom-Json
            foreach ($a in $j.items) { Write-Host ("hesap varligi " + $a.id + " " + $a.type + " " + $a.name + " durum=" + $a.status) }
          } catch { Write-Host ("varlik listesi alinamadi (belirtec kapsami): " + $_.Exception.Message) }
