# Simumav — Windows derleme / paketleme (şirket bilgisayarı: GitHub self-hosted runner, etiketler self-hosted,windows,unreal)
# Güvenlik: depo özeldir; dış PR'lardan (fork) bu iş akışı ÇALIŞMAZ (aşağıdaki koşul + depo ayarı "Require approval for all outside collaborators").
# Kurulum: docs/derleme-windows.md. Değişkenler (Settings → Secrets and variables → Actions):
#   vars.UE_ROOT          ör. C:\Program Files\Epic Games\UE_5.8   (yoksa bu varsayılan)
#   vars.STEAM_APP_ID     gerçek App ID (yoksa 480 = Spacewar geliştirme)
#   vars.STEAM_DEPOT_ID   Windows depot kimliği (Steam yükleme için)
#   secrets.STEAM_USERNAME, secrets.STEAM_CONFIG_VDF (base64; steamcmd oturum dosyası) — yoksa Steam yükleme adımı ATLANIR
#   secrets.CESIUM_ION_TOKEN (isteğe bağlı; pakete gömülecek Cesium ion belirteci — yalnız Simumav uygulamasına kısıtlı belirteç kullanın)
name: build-windows

on:
  push:
    branches: [ main ]
    paths-ignore: [ 'docs/**', '**.md' ]
  workflow_dispatch:
    inputs:
      runner:
        description: "Runner etiketi (bos = vars.RUNNER_LABEL ya da unreal; yeni bilgisayar: unreal5080)"
        type: string
        default: ""
      steam_upload:
        description: "Steam'e yükle (beta dalı)"
        type: boolean
        default: false
      steam_branch:
        description: "Steam dalı (boş = varsayılan dala yükleme yapılmaz, yalnız beta)"
        type: string
        default: "beta"
      ship_artefakt:
        description: "Shipping paketini artefakt olarak yükle (~7 GB, ~30 dk; push derlemelerinde yüklenmez, paket runner diskinde kalır)"
        type: boolean
        default: false
      dev_artefakt:
        description: "Development paketini de artefakt olarak yükle (büyük; varsayılan yalnız Shipping)"
        type: boolean
        default: false

concurrency:
  group: build-windows-${{ github.ref }}
  cancel-in-progress: false

jobs:
  build:
    # fork PR'larından asla; yalnız bu depodaki push/manuel tetik
    if: github.event_name != 'pull_request' && github.repository_owner == 'goktalay'
    runs-on: [self-hosted, windows, "${{ inputs.runner || vars.RUNNER_LABEL || 'unreal' }}"]
    # ilk Fab pisirmesi (golgelendirici derlemesi) uzun surer; sonraki derlemeler Zen DDC'den gelir
    timeout-minutes: 720
    defaults:
      run:
        # Windows PowerShell 5.1 (her Windows'ta var; runner servisi Store/kullanıcı kurulumu pwsh'ı göremeyebilir). Betikler UTF-8 BOM'lu.
        shell: powershell
    env:
      STEAM_APP_ID: ${{ vars.STEAM_APP_ID != '' && vars.STEAM_APP_ID || '480' }}
      ARCHIVE_DIR: ${{ github.workspace }}\Paketler
      # Etkilesimli oturumda Unreal Editor acikken yerel Zen DDC sunucusu (port 8558) o kullanicinin profilinde calisir;
      # NETWORK SERVICE onun dosyalarini okuyamaz (Nanite StreamablePages cokmesi). CI kendi Zen sunucusunu 8559'da acar.
      UE_ZEN_ARGS: "-ini:Engine:[Zen.AutoLaunch]:DesiredPort=8559 -ini:Engine:[Zen.ConnectExisting]:Port=8559"
    steps:
      - name: Depoyu al (LFS dahil)
        uses: actions/checkout@v4
        with:
          lfs: true
          clean: false

      - name: Yollari coz (Unreal, Fab hazirlama projesi, VaultCache)
        # Bilgisayara gore: vars.* yolu varsa o; yoksa bilinen adaylar (yeni bilgisayar C:\claude\..., eski D:\...). Sonraki adimlara GITHUB_ENV ile.
        env:
          UE_ROOT_VAR: ${{ vars.UE_ROOT }}
          FAB_PROJE_VAR: ${{ vars.FAB_PROJE }}
          FAB_VAULT_VAR: ${{ vars.FAB_VAULT }}
        run: |
          function Ilk($liste, $isaret) { foreach ($p in $liste) { if ($p -and (Test-Path (Join-Path $p $isaret))) { return $p } }; return $null }
          $ue = Ilk @($env:UE_ROOT_VAR, 'C:\claude\epic\UE_5.8', 'C:\claude\epic', 'C:\claude\Epic Games\UE_5.8', 'C:\claude\UE_5.8', 'D:\Epic Games\UE_5.8', 'C:\Program Files\Epic Games\UE_5.8') 'Engine\Build\BatchFiles\RunUAT.bat'
          if (-not $ue) {
            $f = Get-ChildItem -Path 'C:\claude', 'D:\' -Filter RunUAT.bat -Recurse -Depth 6 -ErrorAction SilentlyContinue | Select-Object -First 1
            if ($f) { $ue = $f.Directory.Parent.Parent.Parent.FullName }
          }
          $fab = Ilk @($env:FAB_PROJE_VAR, 'C:\claude\SimumavFab', 'D:\SimumavFab') 'Content'
          $vault = Ilk @($env:FAB_VAULT_VAR, 'C:\ProgramData\Epic\EpicGamesLauncher\VaultCache', 'C:\claude\VaultCache', 'C:\claude\epic\VaultCache', 'D:\VaultCache') 'FabLibrary'
          Write-Host "UE_ROOT=$ue"; Write-Host "FAB_PROJE=$fab"; Write-Host "FAB_VAULT=$vault"
          if (-not $ue) { throw 'Unreal Engine 5.8 bulunamadi (vars.UE_ROOT ya da C:\claude\epic\UE_5.8)' }
          "UE_ROOT=$ue" | Out-File -FilePath $env:GITHUB_ENV -Append -Encoding utf8
          if ($fab) { "FAB_PROJE=$fab" | Out-File -FilePath $env:GITHUB_ENV -Append -Encoding utf8 }
          if ($vault) { "FAB_VAULT=$vault" | Out-File -FilePath $env:GITHUB_ENV -Append -Encoding utf8 }

      - name: Ortam denetimi
        run: |
          if (-not (Test-Path "$env:UE_ROOT\Engine\Build\BatchFiles\RunUAT.bat")) { throw "Unreal Engine bulunamadi: $env:UE_ROOT (vars.UE_ROOT)" }
          Write-Host "UE: $env:UE_ROOT"
          git lfs version
          Get-PSDrive -PSProvider FileSystem | Format-Table Name, Used, Free
          Write-Host "Zen (CI): $env:UE_ZEN_ARGS"
          # IncrediBuild kaydi var ama BuildSystem.exe yok (yeni bilgisayar): UBT XGE'yi secip "Failed to start build" ile dusuyordu -> XGE kapali (UBA/yerel)
          $ubtDir = Join-Path $env:APPDATA 'Unreal Engine\UnrealBuildTool'
          New-Item -ItemType Directory -Force -Path $ubtDir | Out-Null
          $xml = '<?xml version="1.0" encoding="utf-8" ?><Configuration xmlns="https://www.unrealengine.com/BuildConfiguration"><BuildConfiguration><bAllowXGE>false</bAllowXGE></BuildConfiguration></Configuration>'
          Set-Content -Path (Join-Path $ubtDir 'BuildConfiguration.xml') -Value $xml -Encoding UTF8
          Write-Host "UBT BuildConfiguration: $ubtDir (bAllowXGE=false)"
          $os = Get-CimInstance Win32_OperatingSystem
          Write-Host ("Bellek: fiziksel {0:N1} GB (bos {1:N1}), sanal/commit {2:N1} GB (bos {3:N1}); islemci {4} mantiksal cekirdek" -f ($os.TotalVisibleMemorySize / 1MB), ($os.FreePhysicalMemory / 1MB), ($os.TotalVirtualMemorySize / 1MB), ($os.FreeVirtualMemory / 1MB), [Environment]::ProcessorCount)
          Get-CimInstance Win32_PageFileUsage -ErrorAction SilentlyContinue | ForEach-Object { Write-Host ("Sayfa dosyasi {0}: {1} MB" -f $_.Name, $_.AllocatedBaseSize) }
          # ayni port ayari proje yapilandirmasina da (yalniz calisma kopyasi): UnrealPak/IoStore sahneleme Zen'i komut satiri almaz
          Add-Content -Path Config/DefaultEngine.ini -Value "`r`n[Zen.AutoLaunch]`r`nDesiredPort=8559`r`n`r`n[Zen.ConnectExisting]`r`nPort=8559"

      - name: Yerel ArduPilot SITL ikililerini indir ve doğrula (sha256)
        run: powershell -NoProfile -ExecutionPolicy Bypass -File Tools/sitl/sitl-indir.ps1

      - name: Steam App ID / Cesium belirteci
        env:
          CESIUM_ION_TOKEN: ${{ secrets.CESIUM_ION_TOKEN }}
        run: |
          Set-Content -NoNewline -Path steam_appid.txt -Value $env:STEAM_APP_ID
          (Get-Content Config/DefaultEngine.ini) -replace '^SteamDevAppId=.*', "SteamDevAppId=$env:STEAM_APP_ID" | Set-Content Config/DefaultEngine.ini
          if ($env:CESIUM_ION_TOKEN) {
            Add-Content Config/DefaultGame.ini "`r`n[/Script/CaySim.CaySimWorldSetup]`r`nCesiumIonToken=$env:CESIUM_ION_TOKEN"
            Write-Host "Cesium ion belirteci pakete eklendi (deger yazdirilmadi)"
          }

      - name: Editor ikilileri (UBT)
        run: |
          . .\Tools\ci\kilit.ps1
          # DJI Remote Controller Link (motor Marketplace eklentisi, yalniz editor ikilisi var): oyun paketine girmesi icin kaynak kodu
          # proje eklentisi olarak kopyalanir (git disinda; proje surumu motor surumunun yerine gecer)
          $dji = Get-ChildItem "$env:UE_ROOT\Engine\Plugins\Marketplace" -Directory -ErrorAction SilentlyContinue | Where-Object { Test-Path (Join-Path $_.FullName 'DJIRemoteController.uplugin') } | Select-Object -First 1
          if ($dji) {
            $hedef = Join-Path $PWD 'Plugins\DJIRemoteController'
            New-Item -ItemType Directory -Force -Path $hedef | Out-Null
            foreach ($k in @('Source', 'Content', 'Resources', 'Config')) { $s = Join-Path $dji.FullName $k; if (Test-Path $s) { robocopy $s (Join-Path $hedef $k) /MIR /NFL /NDL /NJH /NJS /NP | Out-Null } }
            $up = Get-Content -Raw (Join-Path $dji.FullName 'DJIRemoteController.uplugin')
            Set-Content -LiteralPath (Join-Path $hedef 'DJIRemoteController.uplugin') -Value ($up -replace '"Installed"\s*:\s*true', '"Installed": false') -Encoding UTF8
            $ex = Join-Path $PWD '.git\info\exclude'
            if (-not ((Test-Path $ex) -and (Select-String -LiteralPath $ex -SimpleMatch '/Plugins/DJIRemoteController/' -Quiet))) { Add-Content -LiteralPath $ex -Value '/Plugins/DJIRemoteController/' -Encoding ASCII }
            Write-Host ("DJI eklentisi proje eklentisi olarak: " + $dji.FullName)
          } else { Write-Host "DJI eklentisi yok (Marketplace)" }
          $global:LASTEXITCODE = 0
          $rc = Invoke-KilitTekrar { & "$env:UE_ROOT\Engine\Build\BatchFiles\Build.bat" SimumavEditor Win64 Development -Project="$PWD\Simumav.uproject" -WaitMutex -NoHotReload }
          if ($rc -ne 0) { throw "Editor derlemesi basarisiz ($rc)" }

      - name: Fab içerikleri (hazırlama projesi + VaultCache; lisanslı dosyalar depoda değil)
        # D:\SimumavFab\Content paketleri ve VaultCache UE paketleri Content altina kopyalanir, FabLibrary FBX urunleri
        # /Game/Fab altina ice aktarilir, DefaultGame.ini'ye pisirme/harita satirlari eklenir. Hicbiri yoksa uyari verir, derleme surer.
        # editor kapanista asili kalirsa (cizimli VAT oturumu) tum isi 12 saat bekletmesin
        timeout-minutes: 240
        env:
          BLENDER_EXE: ${{ vars.BLENDER_EXE }}
        run: powershell -NoProfile -ExecutionPolicy Bypass -File Tools/fab/fab-hazirla.ps1 -Proje "$PWD" -UeRoot "$env:UE_ROOT"

      - name: Varlıkları koddan üret (Editor Python, headless)
        run: |
          $env:SIMUMAV_EDITOR_ACIK = "0"
          $ddc = @($env:UE_ZEN_ARGS -split ' ' | Where-Object { $_ })
          & "$env:UE_ROOT\Engine\Binaries\Win64\UnrealEditor-Cmd.exe" "$PWD\Simumav.uproject" -ExecutePythonScript="$PWD\Scripts\Python\simumav_varliklar.py" -unattended -nop4 -nosplash -NullRHI -stdout -FullStdOutLogOutput @ddc
          if (-not (Test-Path "Content/Maps/SimumavMain.umap")) { throw "Harita uretilemedi (Content/Maps/SimumavMain.umap)" }
          # editor cikis kodu kapali eklentiye bagli Fab varliklarinin (MetaHuman sac vb.) yukleme hatalarinda 1 olabiliyor; olcut uretilen harita
          if ($LASTEXITCODE -ne 0) { Write-Host "Editor cikis kodu $LASTEXITCODE (harita uretildi - surduruluyor)" }
          exit 0

      # Tools/ci/bekci.ps1: 30 dk yeni gunluk satiri yoksa dokum + surec agaci sonlandirma + sinirli BIR yeniden deneme
      # (9cada62 pisirmesi lightmap dokularinda bellek tukenip 3 saat sessiz asili kalmisti)
      - name: Paketle — Development
        timeout-minutes: 300
        run: |
          . .\Tools\ci\bekci.ps1
          $rc = Invoke-Bekcili -Ad 'Paketle Development' -Bat "$env:UE_ROOT\Engine\Build\BatchFiles\RunUAT.bat" -EkCook $env:UE_ZEN_ARGS -Arglar @('BuildCookRun', "-project=$PWD\Simumav.uproject", '-noP4', '-platform=Win64', '-clientconfig=Development', '-build', '-cook', '-stage', '-pak', '-iostore', '-archive', "-archivedirectory=$env:ARCHIVE_DIR\Development", '-utf8output', '-unattended')
          if ($rc -ne 0) { throw "BuildCookRun Development basarisiz ($rc)" }

      - name: Paketle — Shipping
        timeout-minutes: 300
        run: |
          . .\Tools\ci\bekci.ps1
          $rc = Invoke-Bekcili -Ad 'Paketle Shipping' -Bat "$env:UE_ROOT\Engine\Build\BatchFiles\RunUAT.bat" -EkCook $env:UE_ZEN_ARGS -Arglar @('BuildCookRun', "-project=$PWD\Simumav.uproject", '-noP4', '-platform=Win64', '-clientconfig=Shipping', '-build', '-cook', '-stage', '-pak', '-iostore', '-prereqs', '-archive', "-archivedirectory=$env:ARCHIVE_DIR\Shipping", '-utf8output', '-unattended', '-nodebuginfo')
          if ($rc -ne 0) { throw "BuildCookRun Shipping basarisiz ($rc)" }
          # Shipping'de Steam istemcisi uygulamayi kendi kimligiyle baslatir; gelistirme testleri icin steam_appid.txt paket kokune de konur
          Copy-Item steam_appid.txt "$env:ARCHIVE_DIR\Shipping\Windows\" -Force

      - name: Paket konumu ve boyutu
        run: |
          foreach ($k in @('Development', 'Shipping')) {
            $d = Join-Path $env:ARCHIVE_DIR "$k\Windows"
            if (Test-Path $d) {
              $b = (Get-ChildItem $d -Recurse -File | Measure-Object Length -Sum).Sum
              Write-Host ("{0}: {1} ({2:N2} GB)" -f $k, $d, ($b / 1GB))
              Get-ChildItem (Join-Path $d 'Simumav\Content\Paks') -File -ErrorAction SilentlyContinue | ForEach-Object { Write-Host ("    {0}  {1:N0} MB" -f $_.Name, ($_.Length / 1MB)) }
            }
          }
          Write-Host "Paketler runner diskinde kalir (sonraki derlemede ustune yazilir); artefakt yuklemesi basarisiz olsa da derleme gecerlidir."

      # Buyuk artefakt yuklemesi ag hatasinda (ENOTFOUND blob.core.windows.net) derlemeyi dusurmesin: paket runner'da zaten var
      - name: Artefakt — Shipping
        if: ${{ github.event_name == 'workflow_dispatch' && inputs.ship_artefakt }}
        continue-on-error: true
        uses: actions/upload-artifact@v4
        with:
          name: Simumav-Win64-Shipping-${{ github.sha }}
          path: Paketler/Shipping/Windows
          retention-days: 14
          compression-level: 1

      - name: Artefakt — Development (isteğe bağlı)
        if: ${{ github.event_name == 'workflow_dispatch' && inputs.dev_artefakt }}
        continue-on-error: true
        uses: actions/upload-artifact@v4
        with:
          name: Simumav-Win64-Development-${{ github.sha }}
          path: Paketler/Development/Windows
          retention-days: 7
          compression-level: 1

      - name: Steam'e yükle (steamcmd + app_build vdf)
        if: ${{ github.event_name == 'workflow_dispatch' && inputs.steam_upload }}
        env:
          STEAM_USERNAME: ${{ secrets.STEAM_USERNAME }}
          STEAM_CONFIG_VDF: ${{ secrets.STEAM_CONFIG_VDF }}
          STEAM_DEPOT_ID: ${{ vars.STEAM_DEPOT_ID }}
          STEAM_BRANCH: ${{ inputs.steam_branch }}
        run: |
          if (-not $env:STEAM_USERNAME -or -not $env:STEAM_CONFIG_VDF -or -not $env:STEAM_DEPOT_ID -or $env:STEAM_APP_ID -eq '480') {
            Write-Host "Steam yukleme ATLANDI: STEAM_USERNAME / STEAM_CONFIG_VDF sirlari, STEAM_DEPOT_ID ve gercek STEAM_APP_ID gerekli (docs/steam-yayin.md)."
            exit 0
          }
          powershell -NoProfile -ExecutionPolicy Bypass -File Tools/steam/steam-yukle.ps1 -AppId $env:STEAM_APP_ID -DepotId $env:STEAM_DEPOT_ID -Content "$env:ARCHIVE_DIR\Shipping\Windows" -Branch $env:STEAM_BRANCH -Desc "Simumav $env:GITHUB_SHA"
