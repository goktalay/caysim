# Simumav — Windows derleme / paketleme (şirket bilgisayarı: GitHub self-hosted runner, etiketler self-hosted,windows,unreal)
# Güvenlik: depo özeldir; dış PR'lardan (fork) bu iş akışı ÇALIŞMAZ (aşağıdaki koşul + depo ayarı "Require approval for all outside collaborators").
# Kurulum: docs/derleme-windows.md. Değişkenler (Settings → Secrets and variables → Actions):
#   vars.UE_ROOT          ör. C:\Program Files\Epic Games\UE_5.8   (yoksa bu varsayılan)
#   vars.STEAM_APP_ID     gerçek App ID (yoksa 480 = Spacewar geliştirme)
#   vars.STEAM_DEPOT_ID   Windows depot kimliği (Steam yükleme için)
#   secrets.STEAM_USERNAME, secrets.STEAM_CONFIG_VDF (base64; steamcmd oturum dosyası) — yoksa Steam yükleme adımı ATLANIR
#   secrets.CESIUM_ION_TOKEN (isteğe bağlı; pakete gömülecek Cesium ion belirteci — yalnız Simumav uygulamasına kısıtlı belirteç kullanın)
name: build-windows

on:
  push:
    branches: [ main ]
    paths-ignore: [ 'docs/**', '**.md' ]
  workflow_dispatch:
    inputs:
      steam_upload:
        description: "Steam'e yükle (beta dalı)"
        type: boolean
        default: false
      steam_branch:
        description: "Steam dalı (boş = varsayılan dala yükleme yapılmaz, yalnız beta)"
        type: string
        default: "beta"

concurrency:
  group: build-windows-${{ github.ref }}
  cancel-in-progress: false

jobs:
  build:
    # fork PR'larından asla; yalnız bu depodaki push/manuel tetik
    if: github.event_name != 'pull_request' && github.repository_owner == 'goktalay'
    runs-on: [self-hosted, windows, unreal]
    timeout-minutes: 360
    defaults:
      run:
        # Windows PowerShell 5.1 (her Windows'ta var; runner servisi Store/kullanıcı kurulumu pwsh'ı göremeyebilir). Betikler UTF-8 BOM'lu.
        shell: powershell
    env:
      UE_ROOT: ${{ vars.UE_ROOT != '' && vars.UE_ROOT || 'C:\Program Files\Epic Games\UE_5.8' }}
      STEAM_APP_ID: ${{ vars.STEAM_APP_ID != '' && vars.STEAM_APP_ID || '480' }}
      ARCHIVE_DIR: ${{ github.workspace }}\Paketler
      # Etkilesimli oturumda Unreal Editor acikken yerel Zen DDC sunucusu (port 8558) o kullanicinin profilinde calisir;
      # NETWORK SERVICE onun dosyalarini okuyamaz (Nanite StreamablePages cokmesi). CI kendi Zen sunucusunu 8559'da acar.
      UE_ZEN_ARGS: "-ini:Engine:[Zen.AutoLaunch]:DesiredPort=8559 -ini:Engine:[Zen.ConnectExisting]:Port=8559"
    steps:
      - name: Depoyu al (LFS dahil)
        uses: actions/checkout@v4
        with:
          lfs: true
          clean: false

      - name: Ortam denetimi
        run: |
          if (-not (Test-Path "$env:UE_ROOT\Engine\Build\BatchFiles\RunUAT.bat")) { throw "Unreal Engine bulunamadi: $env:UE_ROOT (vars.UE_ROOT)" }
          Write-Host "UE: $env:UE_ROOT"
          git lfs version
          Get-PSDrive -PSProvider FileSystem | Format-Table Name, Used, Free
          Write-Host "Zen (CI): $env:UE_ZEN_ARGS"
          # ayni port ayari proje yapilandirmasina da (yalniz calisma kopyasi): UnrealPak/IoStore sahneleme Zen'i komut satiri almaz
          Add-Content -Path Config/DefaultEngine.ini -Value "`r`n[Zen.AutoLaunch]`r`nDesiredPort=8559`r`n`r`n[Zen.ConnectExisting]`r`nPort=8559"

      - name: Yerel ArduPilot SITL ikililerini indir ve doğrula (sha256)
        run: powershell -NoProfile -ExecutionPolicy Bypass -File Tools/sitl/sitl-indir.ps1

      - name: Steam App ID / Cesium belirteci
        env:
          CESIUM_ION_TOKEN: ${{ secrets.CESIUM_ION_TOKEN }}
        run: |
          Set-Content -NoNewline -Path steam_appid.txt -Value $env:STEAM_APP_ID
          (Get-Content Config/DefaultEngine.ini) -replace '^SteamDevAppId=.*', "SteamDevAppId=$env:STEAM_APP_ID" | Set-Content Config/DefaultEngine.ini
          if ($env:CESIUM_ION_TOKEN) {
            Add-Content Config/DefaultGame.ini "`r`n[/Script/CaySim.CaySimWorldSetup]`r`nCesiumIonToken=$env:CESIUM_ION_TOKEN"
            Write-Host "Cesium ion belirteci pakete eklendi (deger yazdirilmadi)"
          }

      - name: Editor ikilileri (UBT)
        run: |
          . .\Tools\ci\kilit.ps1
          $rc = Invoke-KilitTekrar { & "$env:UE_ROOT\Engine\Build\BatchFiles\Build.bat" SimumavEditor Win64 Development -Project="$PWD\Simumav.uproject" -WaitMutex -NoHotReload }
          if ($rc -ne 0) { throw "Editor derlemesi basarisiz ($rc)" }

      - name: Fab içerikleri (hazırlama projesi + VaultCache; lisanslı dosyalar depoda değil)
        # D:\SimumavFab\Content paketleri ve VaultCache UE paketleri Content altina kopyalanir, FabLibrary FBX urunleri
        # /Game/Fab altina ice aktarilir, DefaultGame.ini'ye pisirme/harita satirlari eklenir. Hicbiri yoksa uyari verir, derleme surer.
        env:
          FAB_PROJE: ${{ vars.FAB_PROJE }}
        run: powershell -NoProfile -ExecutionPolicy Bypass -File Tools/fab/fab-hazirla.ps1 -Proje "$PWD" -UeRoot "$env:UE_ROOT"

      - name: Varlıkları koddan üret (Editor Python, headless)
        run: |
          $env:SIMUMAV_EDITOR_ACIK = "0"
          $ddc = @($env:UE_ZEN_ARGS -split ' ' | Where-Object { $_ })
          & "$env:UE_ROOT\Engine\Binaries\Win64\UnrealEditor-Cmd.exe" "$PWD\Simumav.uproject" -ExecutePythonScript="$PWD\Scripts\Python\simumav_varliklar.py" -unattended -nop4 -nosplash -NullRHI -stdout -FullStdOutLogOutput @ddc
          if (-not (Test-Path "Content/Maps/SimumavMain.umap")) { throw "Harita uretilemedi (Content/Maps/SimumavMain.umap)" }

      - name: Paketle — Development
        run: |
          . .\Tools\ci\kilit.ps1
          $rc = Invoke-KilitTekrar { & "$env:UE_ROOT\Engine\Build\BatchFiles\RunUAT.bat" BuildCookRun -project="$PWD\Simumav.uproject" -noP4 -platform=Win64 -clientconfig=Development -build -cook -stage -pak -iostore -archive -archivedirectory="$env:ARCHIVE_DIR\Development" -utf8output -unattended "-AdditionalCookerOptions=$env:UE_ZEN_ARGS" }
          if ($rc -ne 0) { throw "BuildCookRun Development basarisiz ($rc)" }

      - name: Paketle — Shipping
        run: |
          . .\Tools\ci\kilit.ps1
          $rc = Invoke-KilitTekrar { & "$env:UE_ROOT\Engine\Build\BatchFiles\RunUAT.bat" BuildCookRun -project="$PWD\Simumav.uproject" -noP4 -platform=Win64 -clientconfig=Shipping -build -cook -stage -pak -iostore -prereqs -archive -archivedirectory="$env:ARCHIVE_DIR\Shipping" -utf8output -unattended -nodebuginfo "-AdditionalCookerOptions=$env:UE_ZEN_ARGS" }
          if ($rc -ne 0) { throw "BuildCookRun Shipping basarisiz ($rc)" }
          # Shipping'de Steam istemcisi uygulamayi kendi kimligiyle baslatir; gelistirme testleri icin steam_appid.txt paket kokune de konur
          Copy-Item steam_appid.txt "$env:ARCHIVE_DIR\Shipping\Windows\" -Force

      - name: Artefakt — Development
        uses: actions/upload-artifact@v4
        with:
          name: Simumav-Win64-Development-${{ github.sha }}
          path: Paketler/Development/Windows
          retention-days: 7

      - name: Artefakt — Shipping
        uses: actions/upload-artifact@v4
        with:
          name: Simumav-Win64-Shipping-${{ github.sha }}
          path: Paketler/Shipping/Windows
          retention-days: 14

      - name: Steam'e yükle (steamcmd + app_build vdf)
        if: ${{ github.event_name == 'workflow_dispatch' && inputs.steam_upload }}
        env:
          STEAM_USERNAME: ${{ secrets.STEAM_USERNAME }}
          STEAM_CONFIG_VDF: ${{ secrets.STEAM_CONFIG_VDF }}
          STEAM_DEPOT_ID: ${{ vars.STEAM_DEPOT_ID }}
          STEAM_BRANCH: ${{ inputs.steam_branch }}
        run: |
          if (-not $env:STEAM_USERNAME -or -not $env:STEAM_CONFIG_VDF -or -not $env:STEAM_DEPOT_ID -or $env:STEAM_APP_ID -eq '480') {
            Write-Host "Steam yukleme ATLANDI: STEAM_USERNAME / STEAM_CONFIG_VDF sirlari, STEAM_DEPOT_ID ve gercek STEAM_APP_ID gerekli (docs/steam-yayin.md)."
            exit 0
          }
          powershell -NoProfile -ExecutionPolicy Bypass -File Tools/steam/steam-yukle.ps1 -AppId $env:STEAM_APP_ID -DepotId $env:STEAM_DEPOT_ID -Content "$env:ARCHIVE_DIR\Shipping\Windows" -Branch $env:STEAM_BRANCH -Desc "Simumav $env:GITHUB_SHA"
