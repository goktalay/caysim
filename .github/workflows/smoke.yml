# Simumav - duman testi (yalniz okur; depoyu degistirmez): runner diskindeki son paketlenmis oyunu -SmvSmoke ile acar.
# Oyun her ekrani sirayla acip ekran goruntusu alir (Saved/Screenshots/Smoke), yerel SITL ile kisa ucus + duraklatma + ozet,
# sonra kapanir. Goruntuler ve gunluk artefakt olarak yuklenir. Runner masaustu oturumu olmadan GPU cizimi yapamiyorsa
# goruntu klasoru bos kalir; gunlukte D3D hatasi gorunur.
name: smoke

on:
  workflow_dispatch:
    inputs:
      runner:
        description: "Runner etiketi (bos = vars.RUNNER_LABEL ya da unreal; yeni bilgisayar: unreal5080)"
        type: string
        default: ""
      config:
        description: "Development ya da Shipping"
        type: string
        default: "Development"
      wait:
        description: "En uzun bekleme (sn)"
        type: string
        default: "2400"
      lang:
        description: "Arayuz dili (bos = runner yerel ayari; tr, en, de ...)"
        type: string
        default: ""
      flights:
        description: "Ucus sayisi (0-10; 1-5 coklu rotor/VTOL/hexa, 6-9 sabit kanat kalkis yontemleri + yuksek irtifa, 10 VTOL 150 m)"
        type: string
        default: "10"
      only:
        description: "Yalniz bu ucuslar (1 tabanli, virgullu; bos = ilk N)"
        type: string
        default: ""
      res:
        description: "Cozunurluk GxY (ornek 3440x1440)"
        type: string
        default: "1600x900"
      realworld:
        description: "Gercek dunya kaynagi (bos = ayar; google3d, terrain, off)"
        type: string
        default: ""
      ekarg:
        description: "Ek komut satiri argumanlari (bosluklu; ornek -CesiumStats)"
        type: string
        default: ""
      notour:
        description: "Ekran turunu atla (yalniz ucuslar)"
        type: boolean
        default: false

jobs:
  smoke:
    if: github.repository_owner == 'goktalay'
    runs-on: [self-hosted, windows, "${{ inputs.runner || vars.RUNNER_LABEL || 'unreal' }}"]
    timeout-minutes: 75
    defaults:
      run:
        shell: powershell
    steps:
      - name: Oyunu calistir
        env:
          CFG: ${{ inputs.config }}
          WAIT: ${{ inputs.wait }}
          SLANG: ${{ inputs.lang }}
          SFLIGHTS: ${{ inputs.flights }}
          SONLY: ${{ inputs.only }}
          SRES: ${{ inputs.res }}
          SNOTOUR: ${{ inputs.notour }}
          SREAL: ${{ inputs.realworld }}
          SEK: ${{ inputs.ekarg }}
        run: |
          $ErrorActionPreference = 'Continue'
          $base = Join-Path $env:GITHUB_WORKSPACE ("Paketler\" + $env:CFG + "\Windows")
          Write-Host ("Paket: " + $base)
          if (-not (Test-Path $base)) { Write-Host "Paket yok"; Get-ChildItem (Join-Path $env:GITHUB_WORKSPACE 'Paketler') -ErrorAction SilentlyContinue | ForEach-Object { Write-Host $_.FullName }; exit 1 }
          $exe = Get-ChildItem $base -Filter *.exe -File | Select-Object -First 1
          Write-Host ("Exe: " + $exe.FullName)
          # Shipping kayit klasoru kullanici profilindedir (LOCALAPPDATA\Simumav\Saved); Development paket klasorundedir
          $saved = Join-Path $base 'Simumav\Saved'
          if ($env:CFG -eq 'Shipping') { $saved = Join-Path $env:LOCALAPPDATA 'Simumav\Saved' }
          Write-Host ("Saved: " + $saved)
          $shots = Join-Path $saved 'Screenshots'
          if (Test-Path $shots) { Remove-Item $shots -Recurse -Force -ErrorAction SilentlyContinue }
          $oldlogs = Join-Path $saved 'Logs'
          if (Test-Path $oldlogs) { Remove-Item $oldlogs -Recurse -Force -ErrorAction SilentlyContinue }
          Write-Host ("Oturum: " + [Environment]::UserInteractive + " / " + $env:USERNAME + " / session " + (Get-Process -Id $PID).SessionId)
          $rx = '1600'; $ry = '900'
          if ($env:SRES -match '^(\d+)x(\d+)$') { $rx = $Matches[1]; $ry = $Matches[2] }
          $argl = @('-SmvSmoke','-RenderOffScreen',('-ResX=' + $rx),('-ResY=' + $ry),'-windowed','-log','-unattended')
          if ($env:SONLY) { $argl += ('-SmvSmokeOnly=' + $env:SONLY) }
          if ($env:SNOTOUR -eq 'true') { $argl += '-SmvSmokeNoTour' }
          if ($env:SREAL) { $argl += ('-SmvRealWorld=' + $env:SREAL) }
          if ($env:SEK) { $argl += ($env:SEK -split ' ' | Where-Object { $_ }) }
          if ($env:SLANG) { $argl += ('-SmvSmokeLang=' + $env:SLANG) }
          if ($env:SFLIGHTS) { $argl += ('-SmvSmokeFlights=' + $env:SFLIGHTS) }
          Write-Host ("Args: " + ($argl -join ' '))
          $p = Start-Process -FilePath $exe.FullName -ArgumentList $argl -PassThru
          $deadline = (Get-Date).AddSeconds([int]$env:WAIT)
          while (-not $p.HasExited -and (Get-Date) -lt $deadline) { Start-Sleep -Seconds 5 }
          if (-not $p.HasExited) { Write-Host "Zaman asimi: kapatiliyor"; Stop-Process -Id $p.Id -Force -ErrorAction SilentlyContinue }
          $out = Join-Path $env:RUNNER_TEMP 'smoke'
          New-Item -ItemType Directory -Force -Path $out | Out-Null
          if (Test-Path $shots) { Copy-Item -Recurse -Force $shots (Join-Path $out 'Screenshots') }
          $logs = Join-Path $saved 'Logs'
          if (Test-Path $logs) { Copy-Item -Recurse -Force $logs (Join-Path $out 'Logs') }
          Get-ChildItem $out -Recurse -File | ForEach-Object { Write-Host ($_.FullName + "  " + $_.Length) }
          $log = Get-ChildItem (Join-Path $out 'Logs') -Filter *.log -File -ErrorAction SilentlyContinue | Select-Object -First 1
          if ($log) { Select-String -LiteralPath $log.FullName -Pattern 'SMOKE|SMVLOAD|3D Tiles|Error|D3D|RHI|Active\]|Device 0|Fab haritas|GPS/EKF|Need Position|Arm:|U.u. d.nyas|Google|Cesium|kenar e.leme|Kalk.. a.ama|Uyar.:' | Select-Object -First 900 | ForEach-Object { Write-Host $_.Line } }
      - name: Artefakt
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: smoke-${{ inputs.config }}-${{ inputs.lang }}
          path: ${{ runner.temp }}/smoke
          if-no-files-found: warn
          retention-days: 7
