# Simumav - arayuz eklentileri envanteri (sirket bilgisayari). Yalniz okur: hicbir dosyayi degistirmez, kopyalamaz.
# Fab'den alinan arayuz eklentilerinin (Main Menu & Settings System, Effect Forge) ve icerik paketlerinin
# (Procedural Radial Wheel Menu, Airplane Instruments) API'sini ogrenmek icin: .uplugin, Source basliklarindaki
# UCLASS/UFUNCTION/UPROPERTY satirlari, Content klasor yapisi ve varlik adlari. Sonuc ui-envanter.txt artefakti.
name: ui-envanter

on:
  workflow_dispatch:
    inputs:
      ekstra:
        description: "Ek taranacak klasorler (; ile ayrilmis)"
        type: string
        default: ""

jobs:
  envanter:
    if: github.repository_owner == 'goktalay'
    runs-on: [self-hosted, windows, unreal]
    timeout-minutes: 20
    defaults:
      run:
        shell: powershell
    steps:
      - name: Envanter
        env:
          UE_ROOT: ${{ vars.UE_ROOT }}
          EKSTRA: ${{ inputs.ekstra }}
        run: |
          $ErrorActionPreference = 'Continue'
          $out = Join-Path $env:RUNNER_TEMP 'ui-envanter.txt'
          function W($s) { Add-Content -Path $out -Value $s -Encoding UTF8; Write-Host $s }
          $ue = if ($env:UE_ROOT) { $env:UE_ROOT } else { 'D:\Epic Games\UE_5.8' }
          $roots = @()
          foreach ($m in @("$ue\Engine\Plugins\Marketplace", "D:\Epic Games\UE_5.8\Engine\Plugins\Marketplace", "$ue\Engine\Plugins\Fab")) {
            if (Test-Path $m) {
              Get-ChildItem $m -Directory -ErrorAction SilentlyContinue | Where-Object { $_.Name -like 'MainMenu*' -or $_.Name -like 'EffectFo*' -or $_.Name -like '*Menu*' -or $_.Name -like '*Radial*' -or $_.Name -like '*Instrument*' } | ForEach-Object { $roots += $_.FullName }
            }
          }
          $roots += @('D:\SimumavFab\Content\Procedural_Radial_Wheel_Menu', 'D:\SimumavFab\Content\AirplaneInstruments')
          if ($env:EKSTRA) { $roots += $env:EKSTRA.Split(';') | Where-Object { $_ } }
          $roots = $roots | Select-Object -Unique
          foreach ($r in $roots) {
            W ""
            W ("################ " + $r)
            if (-not (Test-Path $r)) { W "  (yok)"; continue }
            Get-ChildItem -LiteralPath $r -Filter *.uplugin -File -ErrorAction SilentlyContinue | ForEach-Object {
              W ("=== " + $_.Name)
              Get-Content -LiteralPath $_.FullName -ErrorAction SilentlyContinue | ForEach-Object { W ("  " + $_) }
            }
            $src = Join-Path $r 'Source'
            if (Test-Path $src) {
              W "=== Source dosyalari"
              Get-ChildItem -LiteralPath $src -Recurse -File -ErrorAction SilentlyContinue | ForEach-Object { W ("  " + $_.FullName.Substring($r.Length)) }
              W "=== Baslik bildirimleri (UCLASS/USTRUCT/UENUM/UFUNCTION/UPROPERTY/class)"
              Get-ChildItem -LiteralPath $src -Recurse -Include *.h -File -ErrorAction SilentlyContinue | ForEach-Object {
                W ("--- " + $_.FullName.Substring($r.Length))
                Select-String -LiteralPath $_.FullName -Pattern '^\s*(UCLASS|USTRUCT|UENUM|UINTERFACE|UFUNCTION|UPROPERTY|class\s+\w+_API|struct\s+\w+_API|enum class|DECLARE_)' -Context 0,1 -ErrorAction SilentlyContinue | ForEach-Object {
                  W ("  " + $_.Line.Trim())
                  foreach ($c in $_.Context.PostContext) { W ("      " + $c.Trim()) }
                }
              }
              W "=== Build.cs"
              Get-ChildItem -LiteralPath $src -Recurse -Filter *.Build.cs -File -ErrorAction SilentlyContinue | ForEach-Object { W ("--- " + $_.Name); Get-Content -LiteralPath $_.FullName | ForEach-Object { W ("  " + $_) } }
            }
            $bin = Join-Path $r 'Binaries'
            if (Test-Path $bin) { W "=== Binaries"; Get-ChildItem -LiteralPath $bin -Recurse -File -ErrorAction SilentlyContinue | Select-Object -First 40 | ForEach-Object { W ("  " + $_.FullName.Substring($r.Length)) } }
            $cnt = if (Test-Path (Join-Path $r 'Content')) { Join-Path $r 'Content' } else { $r }
            W ("=== Content yapisi: " + $cnt)
            Get-ChildItem -LiteralPath $cnt -Recurse -File -Include *.uasset,*.umap -ErrorAction SilentlyContinue | Select-Object -First 600 | ForEach-Object { W ("  " + $_.FullName.Substring($cnt.Length) + "  " + [math]::Round($_.Length / 1KB) + " KB") }
            $cfg = Join-Path $r 'Config'
            if (Test-Path $cfg) { W "=== Config"; Get-ChildItem -LiteralPath $cfg -File | ForEach-Object { W ("--- " + $_.Name); Get-Content -LiteralPath $_.FullName | Select-Object -First 80 | ForEach-Object { W ("  " + $_) } } }
          }
          W ""
          W "=== Motorda CommonUI / CommonInput"
          foreach ($p in @("$ue\Engine\Plugins\Runtime\CommonUI", "$ue\Engine\Plugins\Experimental\CommonUI", "$ue\Engine\Plugins\Runtime\CommonInput")) { W ("  " + $p + " : " + (Test-Path $p)) }
      - name: Artefakt
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: ui-envanter
          path: ${{ runner.temp }}/ui-envanter.txt
          if-no-files-found: ignore
          retention-days: 7
