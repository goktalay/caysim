; Simumav — kalite ön ayarlarına ek (BaseScalability.ini üstüne anahtar bazında birleşir).
; Hedef: Yüksek (3) / Ultra-Sinematik (4) ayarında RTX 4070–5080 sınıfı (12–16 GB) kartlarda bulanık / pikselli doku kalmasın;
; ultra geniş (3440×1440) ekranda TSR çıktısı keskin olsun. Düşük ayarlar motor varsayılanında kalır.

[TextureQuality@3]
; doku akış havuzu (MB): motor varsayılanı 1000 MB — Fab haritaları + Cesium / Google 3B karoları ile taşıyor, dokular düşük mip'te kalıyordu
r.Streaming.PoolSize=3000
r.Streaming.LimitPoolSizeToVRAM=1
r.MaxAnisotropy=16

[TextureQuality@4]
r.Streaming.PoolSize=6000
r.Streaming.LimitPoolSizeToVRAM=1
r.MaxAnisotropy=16
; yakın plan için tam mip (uzakta akış yine düşürür)
r.Streaming.MipBias=0

[PostProcessQuality@3]
; TSR / TAA sonrası keskinleştirme (0 = kapalı); ultra geniş ekranda yumuşak görüntüyü toparlar
r.Tonemapper.Sharpen=0.5

[PostProcessQuality@4]
r.Tonemapper.Sharpen=0.7
r.TSR.History.ScreenPercentage=200

[ViewDistanceQuality@4]
r.ViewDistanceScale=1.5
