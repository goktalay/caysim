[SystemSettings]
; OverCrowd eklentisinin ayar CDO su (GC disi havuz) Blueprint sinifina sert basvuru tutuyor; Development paketinde GC varsayim
; denetimi acilista olumcul hata veriyordu (Shipping denetlemez). Siniflar ayrica koke alinir (SmvGameInstance).
gc.VerifyAssumptions=0
; D3D12 GPU çökmesi (DXGI device removed / hung; kullanıcı bilgisayarında RTX 5080'de iki kez, Lumen eşzamansız hesaplama şüphesi):
; Lumen sahne aydınlatma / dolaylı ışık / yansıma geçişleri eşzamansız hesaplama kuyruğunda çalıştırılmaz (grafik kuyruğunda; ~%2–4 süre).
; Yine de GPU çökmesi olursa bir sonraki açılışta SmvGameInstance güvenli grafik kipine geçer (r.RDG.AsyncCompute 0, Lumen yazılım izleme).
r.LumenScene.Lighting.AsyncCompute=0
r.Lumen.DiffuseIndirect.AsyncCompute=0
r.Lumen.Reflections.AsyncCompute=0
; büyük açık haritalar (İleri Karakol 4 × 4 km çalılık, Adalar 16 × 16 km): binlerce bitki örneği donanımsal ışın izleme sahnesinde
; Lumen dünya parıltı önbelleğini (UpdateWorldRadianceCaches) GPU zaman aşımına sokuyordu (DXGI_ERROR_DEVICE_HUNG, duman 40803085411) →
; örnekli ağlar (bitki / çalı / kaya kümeleri) ışın izleme sahnesine girmez, uzak küçük nesneler ayıklanır
r.RayTracing.Geometry.InstancedStaticMeshes=0
r.RayTracing.Culling=1
r.RayTracing.Culling.Radius=15000

; Cesium 3D Tiles (assets.ion.cesium.com / CloudFront): çok sayıda eşzamanlı TLS el sıkışması "SSL connect error (35)" ile düşüyordu
; (karolar eksik / uydu dokusu beyaz) — sunucu başına bağlantı sınırlı, bağlantılar yeniden kullanılır
[HTTP.Curl]
MaxHostConnections=8


; Cesium for Unreal eklentisinin kendi Engine.ini ayarı (eklenti paketli oyunda bağlanmadığı için uygulanmıyordu): HTTP iş parçacığı
; etkinken 1 ms aralıkla döner — karo indirme hızı (özellikle Google fotogerçekçi 3B) belirgin artar
[HTTP]
HttpThreadActiveFrameTimeInSeconds=0.001
; bölge haritası (SmvRegion): Overpass sorguyu hesaplarken ~50 sn hiç bayt göndermez — etkinlik zaman aşımı kısa kalınca istek HTTP 0 ile
; kesiliyordu (duman 40391052512). Bağlantı kurma süresi ayrı (HttpConnectionTimeout) kısa kalır.
HttpActivityTimeout=200
