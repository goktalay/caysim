[/Script/EngineSettings.GameMapsSettings]
; Harita içeriği boştur: dünya, dron, ışık, gök, arayüz çalışma anında koddan kurulur. Harita Editor Python betiğiyle üretilir
; (Scripts/Python/simumav_varliklar.py — CI'da headless). CAYSIM kurumsal istemcisi: ?game=/Script/CaySim.CaySimGameMode
