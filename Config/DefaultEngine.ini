[URL]
GameName=Simumav

[/Script/EngineSettings.GameMapsSettings]
; Harita içeriği boştur: dünya, dron, ışık, gök, arayüz çalışma anında koddan kurulur. Harita Editor Python betiğiyle üretilir
; (Scripts/Python/simumav_varliklar.py — CI'da headless). CAYSIM kurumsal istemcisi: ?game=/Script/CaySim.CaySimGameMode
GameDefaultMap=/Game/Maps/SimumavMain.SimumavMain
EditorStartupMap=/Game/Maps/SimumavMain.SimumavMain
GlobalDefaultGameMode=/Script/Simumav.SmvGameMode
GameInstanceClass=/Script/Simumav.SmvGameInstance

[/Script/Engine.RendererSettings]
; Lumen GI + yansıma, Nanite, sanal gölge haritaları, Sky Atmosphere, hacimsel bulut
r.DynamicGlobalIlluminationMethod=1
r.ReflectionMethod=1
r.Lumen.HardwareRayTracing=True
r.Lumen.TraceMeshSDFs=0
r.GenerateMeshDistanceFields=True
r.Nanite.ProjectEnabled=True
r.Shadow.Virtual.Enable=1
r.SupportSkyAtmosphere=True
r.SupportSkyAtmosphereAffectsHeightFog=True
r.VolumetricCloud=1
r.DefaultFeature.AutoExposure.ExtendDefaultLuminanceRange=True
r.DefaultFeature.AutoExposure.Method=0
r.DefaultFeature.MotionBlur=False
r.AntiAliasingMethod=4
r.TemporalAA.Upsampling=True
r.ScreenPercentage=100
r.SkinCache.CompileShaders=True
; sanal doku desteği: Fab arazi malzemeleri (Brushify / Hyper Auto Landscape; RVT ve sanal doku örnekleyicileri) bu kapalıyken derlenemeyip
; varsayılan malzemeye düşüyordu — arazide beyaz-mor benekli / pikselli doku
r.VirtualTextures=True
r.VT.EnableAutoImport=True
r.RayTracing=True
r.AllowStaticLighting=False
r.CustomDepth=3
r.Mobile.EnableNoPrecomputedLightingCSMShader=1
; MetaHuman pilot (MCC): yüz ağlarının kemik sayısı / etki sınırları
r.GPUSkin.Support16BitBoneIndex=True
r.GPUSkin.UnlimitedBoneInfluences=True
SkeletalMesh.UseExperimentalChunking=1

[/Script/WindowsTargetPlatform.WindowsTargetSettings]
DefaultGraphicsRHI=DefaultGraphicsRHI_DX12
-D3D12TargetedShaderFormats=PCD3D_SM5
+D3D12TargetedShaderFormats=PCD3D_SM6
-D3D11TargetedShaderFormats=PCD3D_SM5
+D3D11TargetedShaderFormats=PCD3D_SM5
Compiler=Default
AudioSampleRate=48000

[/Script/Engine.Engine]
; Büyük dünya koordinatları (Cesium): double hassasiyet
bUseFixedFrameRate=False
bSmoothFrameRate=True
SmoothedFrameRateRange=(LowerBound=(Type=Inclusive,Value=30.000000),UpperBound=(Type=Exclusive,Value=120.000000))

[/Script/Engine.CollisionProfile]
; Cesium fizik mesh'leri WorldStatic kanalındadır; yer ışınları bunu kullanır

[/Script/CesiumRuntime.CesiumRuntimeSettings]
; Cesium ion belirteci burada DEĞİL: Config/UserSecrets.ini (gitignore) ya da uygulama içi ayarlardan girilir
EnableExperimentalOcclusionCullingFeature=False
RequestsPerCachePrune=10000
MaxCacheItems=4096

[/Script/Engine.PhysicsSettings]
DefaultGravityZ=-980.000000
bEnableEnhancedDeterminism=False

[/Script/Engine.Engine]
+NetDriverDefinitions=(DefName="GameNetDriver",DriverClassName="/Script/SteamSockets.SteamSocketsNetDriver",DriverClassNameFallback="/Script/OnlineSubsystemUtils.IpNetDriver")

[OnlineSubsystem]
DefaultPlatformService=Steam

[OnlineSubsystemSteam]
bEnabled=true
; Steam App ID henüz yok: 480 (Spacewar) geliştirme yer tutucusu. Gerçek App ID gelince burada ve steam_appid.txt'de değiştirin
; (CI: STEAM_APP_ID değişkeni ile otomatik; docs/steam-yayin.md).
SteamDevAppId=480
bInitServerOnClient=true
bRelaunchInSteam=false
GameServerQueryPort=27015
bVACEnabled=0
GameVersion=0.2.0
