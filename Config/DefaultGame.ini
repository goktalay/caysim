[/Script/Simumav.SmvFabContent]
; Uçuş haritaları kayıt tablosunda (Source/Simumav/Private/SmvMapRegistry.cpp). İsteğe bağlı ayarlar:
; +Maps=<anahtar>|/Game/.../Harita     ek harita ya da tablodaki haritanın yolunu değiştirme
; +MapStart=<anahtar>|X,Y               kalkış noktası (harita koordinatı, cm; yoksa PlayerStart / düz açıklık / merkez)
; EngineSoundProp= / EngineSoundPusher= / EngineSoundJet=   uçak / VTOL itici / jet motor sesi (/Game/... ses varlığı; yoksa /Game/Fab/Sounds/SC_Engine_<tür>)
; Dron gövdesi ayarları (isteğe bağlı):
; DroneSpanM=0.52     yatay en büyük boyut (m; pervane uçları dahil). Yoksa model 25–150 cm ise olduğu gibi (Fab Quadcopter 51,8 cm), değilse 0,6 m; görünürlük ×2,5 ayrıca
; DroneYawDeg=0       burun yönü düzeltmesi (yoksa gimbal/kamera kemiği burun kabul edilir)
; FpvSpanM / FpvYawDeg  aynısı FPV/önleyici gövdesi için (/Game/Fab/DroneFpv; varsayılan 0,35 m)
; UseUltraDynamicSky=True   Ultra Dynamic Sky paketi varsa düz dünyada (prosedürel/Fab haritası) yerleşik gök yerine kullanılır
; UdsSkyClass= / UdsWeatherClass=   UDS Blueprint sınıf yolları (boşsa /Game/UltraDynamicSky altında adla aranır)
; PropsEnabled=True     /Game/Fab/Props sahne dekoru (yalnız görsel statik ağlar) prosedürel dünyada ev alanının doğusuna konur

