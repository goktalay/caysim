+AxisConfig=(AxisKeyName="GenericUSBController_Axis3",AxisProperties=(DeadZone=0.0,Exponent=1.000000,Sensitivity=1.000000))
+AxisConfig=(AxisKeyName="GenericUSBController_Axis4",AxisProperties=(DeadZone=0.02,Exponent=1.000000,Sensitivity=1.000000))

